<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../img/logo.jpg" type="image/x-icon">
  <title>Equipo | Liga Infantil y Juvenil de las Estrellas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top shadow-sm">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <img src="../img/logo.jpg" alt="Logo" class="brand-logo me-2">
        <strong>Liga Infantil y Juvenil de las Estrellas</strong>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html#inicio">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#equipos">Equipos</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#tabla">Tabla</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#calendario">Partidos</a></li>
          <li class="nav-item"><a class="nav-link text-success" href="admin.html">Admin</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero del equipo -->
  <header class="hero d-flex align-items-center" id="team-hero" style="min-height:40vh">
    <div class="overlay"></div>
    <div class="container position-relative text-light py-5 mt-4">
      <div class="d-flex align-items-center gap-4 flex-wrap">
        <div id="team-crest-wrap"
             style="width:80px;height:80px;border-radius:50%;overflow:hidden;background:#1a1a2e;display:flex;align-items:center;justify-content:center;font-size:2.5rem;flex-shrink:0">
          <span>⚽</span>
        </div>
        <div>
          <p class="badge bg-primary text-uppercase mb-1">Perfil del equipo</p>
          <h1 class="display-5 fw-bold mb-1" id="team-name">Cargando…</h1>
          <p class="lead mb-0" id="team-coach"></p>
        </div>
      </div>
    </div>
  </header>

  <!-- Contenido principal -->
  <main class="py-5 bg-dark text-light">
    <div class="container">

      <!-- Mensaje de error -->
      <div id="error-msg" class="alert alert-danger d-none" role="alert">
        No se pudo cargar la información del equipo.
      </div>

      <!-- Tabs de categorías -->
      <div id="categories-section">
        <ul class="nav nav-pills mb-4" id="cat-tabs" role="tablist"></ul>
        <div class="tab-content" id="cat-content"></div>
      </div>

    </div>
  </main>

  <footer class="py-4 bg-black text-center text-secondary">
    <small>© 2026 Liga Infantil y Juvenil de las Estrellas. Todos los derechos reservados.</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="equipo.js"></script>
</body>
</html>
